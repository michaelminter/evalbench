[project]
name = "evalbench"
version = "0.1.0"
description = "Browser UI for running one prompt across Claude Code and Codex CLI models/efforts, with side-by-side results and an LLM judge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
evalbench = "evalbench.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
